services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: prodflow
      POSTGRES_USER: prodflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup first}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prodflow -d prodflow']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
